[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asclepius-backend"
version = "0.1.0"
description = "Asclepius CLI security evaluator for LLM systems."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
    "portalocker[win32]>=4,<5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
asclepius = "asclepius.cli:main"

[project.optional-dependencies]
dev = [
    "pip-tools>=7,<8",
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "asclepius"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: explicit opt-in provider calls; skipped without opt-in and credentials"]
